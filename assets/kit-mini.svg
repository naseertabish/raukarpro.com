<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <defs>
    <linearGradient id="bgMini" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="filmShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" rx="16" fill="url(#bgMini)"/>
  <!-- Subtle technical grid dots -->
  <circle cx="40" cy="36" r="2" fill="#CBD5E1"/>
  <circle cx="60" cy="36" r="2" fill="#CBD5E1"/>
  <circle cx="40" cy="56" r="2" fill="#CBD5E1"/>
  <circle cx="440" cy="244" r="2" fill="#CBD5E1"/>
  <circle cx="420" cy="244" r="2" fill="#CBD5E1"/>

  <!-- Item 1: Thermal Window Shrink-Film & Tape (Left) -->
  <g transform="translate(36, 46)">
    <!-- Window pane with clear thermal film -->
    <rect x="0" y="10" width="124" height="142" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <rect x="10" y="20" width="104" height="122" rx="4" fill="url(#filmShine)" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Window mullions -->
    <line x1="62" y1="20" x2="62" y2="142" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="10" y1="81" x2="114" y2="81" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Thermal diagonal reflection lines -->
    <line x1="22" y1="45" x2="46" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="58" x2="38" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Heavy-duty tape roll in front -->
    <circle cx="108" cy="144" r="24" fill="#F59E0B" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="108" cy="144" r="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- Item 2: Carbon Monoxide (CO) 10-Year Detector (Center - Hero Item) -->
  <g transform="translate(186, 40)">
    <!-- Soft shadow -->
    <rect x="6" y="14" width="118" height="150" rx="22" fill="#CBD5E1" opacity="0.5"/>
    <!-- Device body -->
    <rect x="0" y="6" width="118" height="150" rx="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <!-- LCD Screen -->
    <rect x="18" y="26" width="82" height="40" rx="8" fill="#0F172A"/>
    <rect x="24" y="34" width="16" height="24" rx="2" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="46" y="34" width="16" height="24" rx="2" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="68" y="34" width="16" height="24" rx="2" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Status LEDs -->
    <circle cx="34" cy="84" r="5" fill="#16A34A"/>
    <circle cx="59" cy="84" r="5" fill="#E2E8F0"/>
    <circle cx="84" cy="84" r="5" fill="#E2E8F0"/>
    <!-- Speaker grill dots -->
    <circle cx="42" cy="108" r="2.2" fill="#64748B"/><circle cx="53" cy="108" r="2.2" fill="#64748B"/><circle cx="64" cy="108" r="2.2" fill="#64748B"/><circle cx="75" cy="108" r="2.2" fill="#64748B"/>
    <circle cx="42" cy="118" r="2.2" fill="#64748B"/><circle cx="53" cy="118" r="2.2" fill="#64748B"/><circle cx="64" cy="118" r="2.2" fill="#64748B"/><circle cx="75" cy="118" r="2.2" fill="#64748B"/>
    <!-- Test button -->
    <rect x="34" y="130" width="50" height="14" rx="7" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8"/>
    <!-- 10-Yr Battery Badge -->
    <rect x="78" y="-4" width="48" height="24" rx="12" fill="#16A34A"/>
    <path d="M92 8L97 13L108 3" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Item 3: EPDM Rubber Door Draft Seal Coil (Right) -->
  <g transform="translate(332, 64)">
    <circle cx="58" cy="68" r="52" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    <circle cx="58" cy="68" r="39" fill="none" stroke="#475569" stroke-width="5"/>
    <circle cx="58" cy="68" r="27" fill="none" stroke="#64748B" stroke-width="4"/>
    <circle cx="58" cy="68" r="15" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Unrolling strip tail -->
    <path d="M58 120H116" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
    <path d="M58 120H116" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Draft block arrows -->
    <path d="M16 146H44" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38 140L44 146L38 152" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="54" y1="136" x2="54" y2="156" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom label bar (pure geometric icons) -->
  <rect x="36" y="232" width="408" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="62" cy="246" r="5" fill="#0284C7"/>
  <rect x="74" y="243" width="68" height="6" rx="3" fill="#CBD5E1"/>
  <circle cx="184" cy="246" r="5" fill="#16A34A"/>
  <rect x="196" y="243" width="82" height="6" rx="3" fill="#CBD5E1"/>
  <circle cx="322" cy="246" r="5" fill="#D97706"/>
  <rect x="334" y="243" width="84" height="6" rx="3" fill="#CBD5E1"/>
</svg>
